<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#f8fafc"/>
  <text x="96" y="92" font-family="Inter,Arial" font-size="34" font-weight="800" fill="#0f172a">Private memory pipeline</text>
  <text x="96" y="130" font-family="Inter,Arial" font-size="18" fill="#64748b">Large inbox context is processed in bounded local shards before any model sees a summary.</text>
  <g font-family="Inter,Arial">
    <rect x="96" y="210" width="190" height="110" rx="18" fill="#ffffff" stroke="#d8dee8"/>
    <text x="128" y="260" font-size="24" font-weight="800" fill="#111827">Gmail</text>
    <text x="128" y="292" font-size="16" fill="#64748b">threads</text>
    <rect x="326" y="210" width="190" height="110" rx="18" fill="#ffffff" stroke="#d8dee8"/>
    <text x="358" y="260" font-size="24" font-weight="800" fill="#111827">Local DB</text>
    <text x="358" y="292" font-size="16" fill="#64748b">private bodies</text>
    <rect x="556" y="210" width="190" height="110" rx="18" fill="#ffffff" stroke="#d8dee8"/>
    <text x="588" y="260" font-size="24" font-weight="800" fill="#111827">Shards</text>
    <text x="588" y="292" font-size="16" fill="#64748b">time + topic</text>
    <rect x="786" y="210" width="190" height="110" rx="18" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="818" y="260" font-size="24" font-weight="800" fill="#111827">Judge</text>
    <text x="818" y="292" font-size="16" fill="#64748b">support check</text>
    <rect x="1016" y="210" width="230" height="110" rx="18" fill="#ffffff" stroke="#d8dee8"/>
    <text x="1048" y="260" font-size="24" font-weight="800" fill="#111827">Claims</text>
    <text x="1048" y="292" font-size="16" fill="#64748b">evidence backed</text>
  </g>
  <g stroke="#94a3b8" stroke-width="4">
    <path d="M286 265 H326"/><path d="M516 265 H556"/><path d="M746 265 H786"/><path d="M976 265 H1016"/>
  </g>
  <g font-family="Inter,Arial">
    <rect x="96" y="408" width="578" height="322" rx="24" fill="#ffffff" stroke="#d8dee8"/>
    <text x="132" y="468" font-size="25" font-weight="800" fill="#0f172a">Model sees</text>
    <text x="132" y="526" font-size="20" fill="#111827">aggregate shard summary</text>
    <text x="132" y="578" font-size="20" fill="#111827">counts, dates, terms, domains</text>
    <text x="132" y="630" font-size="20" fill="#111827">evidence IDs and hashes</text>
    <text x="132" y="682" font-size="20" fill="#111827">candidate claim text</text>
    <rect x="766" y="408" width="578" height="322" rx="24" fill="#ffffff" stroke="#fecaca"/>
    <text x="802" y="468" font-size="25" font-weight="800" fill="#0f172a">Model does not see</text>
    <text x="802" y="526" font-size="20" fill="#111827">raw email bodies</text>
    <text x="802" y="578" font-size="20" fill="#111827">raw resume files</text>
    <text x="802" y="630" font-size="20" fill="#111827">private notes</text>
    <text x="802" y="682" font-size="20" fill="#111827">full personal archive</text>
  </g>
</svg>

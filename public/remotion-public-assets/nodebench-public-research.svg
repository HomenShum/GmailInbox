<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#f8fafc"/>
  <text x="92" y="92" font-family="Inter,Arial" font-size="34" font-weight="800" fill="#0f172a">NodeBench public research bridge</text>
  <text x="92" y="128" font-family="Inter,Arial" font-size="18" fill="#64748b">Public company and role facts return with source evidence. Private scoring stays in Gmail.</text>
  <g font-family="Inter,Arial">
    <rect x="92" y="190" width="322" height="144" rx="22" fill="#ffffff" stroke="#d8dee8"/>
    <text x="124" y="246" font-size="18" fill="#6366f1" font-weight="700">INPUT</text>
    <text x="124" y="286" font-size="28" font-weight="800" fill="#111827">company, role, domain</text>
    <text x="124" y="318" font-size="17" fill="#64748b">no raw email body</text>
    <path d="M430 262 H560" stroke="#94a3b8" stroke-width="4"/>
    <polygon points="560,262 542,252 542,272" fill="#94a3b8"/>
    <rect x="584" y="190" width="322" height="144" rx="22" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="616" y="246" font-size="18" fill="#6366f1" font-weight="700">NODEBENCH</text>
    <text x="616" y="286" font-size="28" font-weight="800" fill="#111827">research_role</text>
    <text x="616" y="318" font-size="17" fill="#64748b">resolve, search, verify</text>
    <path d="M922 262 H1052" stroke="#94a3b8" stroke-width="4"/>
    <polygon points="1052,262 1034,252 1034,272" fill="#94a3b8"/>
    <rect x="1076" y="190" width="272" height="144" rx="22" fill="#ffffff" stroke="#d8dee8"/>
    <text x="1108" y="246" font-size="18" fill="#6366f1" font-weight="700">OUTPUT</text>
    <text x="1108" y="286" font-size="28" font-weight="800" fill="#111827">context pack</text>
    <text x="1108" y="318" font-size="17" fill="#64748b">sources and risks</text>
  </g>
  <g font-family="Inter,Arial">
    <rect x="92" y="402" width="586" height="360" rx="24" fill="#ffffff" stroke="#d8dee8"/>
    <text x="126" y="462" font-size="24" font-weight="800" fill="#0f172a">Public dossier</text>
    <text x="126" y="516" font-size="20" fill="#111827">1. Company product and market signals</text>
    <text x="126" y="568" font-size="20" fill="#111827">2. Role expectations and likely interview themes</text>
    <text x="126" y="620" font-size="20" fill="#111827">3. Risk flags and missing public facts</text>
    <text x="126" y="672" font-size="20" fill="#111827">4. Claim confidence and freshness</text>
    <text x="126" y="724" font-size="17" fill="#64748b">Stored as reusable public research for future apps.</text>
    <rect x="750" y="402" width="598" height="360" rx="24" fill="#ffffff" stroke="#d8dee8"/>
    <text x="784" y="462" font-size="24" font-weight="800" fill="#0f172a">Private Gmail layer</text>
    <text x="784" y="516" font-size="20" fill="#111827">1. Resume fit score</text>
    <text x="784" y="568" font-size="20" fill="#111827">2. Reply draft and next action</text>
    <text x="784" y="620" font-size="20" fill="#111827">3. Calendar block suggestion</text>
    <text x="784" y="672" font-size="20" fill="#111827">4. Local evidence IDs for audit</text>
    <text x="784" y="724" font-size="17" fill="#64748b">Raw resume, raw email, and preferences never leave the app.</text>
  </g>
</svg>
